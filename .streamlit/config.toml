# Native-widget theming (restyle round, revised twice after team feedback).
# primaryColor drives radio dots, focus rings and progress bars.
# Font decision v3 (2026-07): Inter for UI text (professional, screen-first),
# JetBrains Mono for the monospace accents. The families are LOADED by the
# Google-Fonts @import at the top of app/intake.py's DARK_CSS — this config
# only tells Streamlit's own widgets to reference them. Both stacks carry
# system fallbacks so an offline demo degrades gracefully.
# Accent decision v2: orange #e0872f -> light indigo #818cf8 (indigo-400);
# classic indigo #4B0082 would be nearly invisible on this background.

[theme]
base = "dark"
primaryColor = "#818cf8"
backgroundColor = "#0f1115"
secondaryBackgroundColor = "#1b1e26"
textColor = "#e8e9ec"
font = "Inter, -apple-system, 'Segoe UI', sans-serif"
codeFont = "'JetBrains Mono', 'Courier New', monospace"
