# Native-widget theming (restyle round, revised after team feedback).
# primaryColor drives radio dots, focus rings and progress bars.
# Font decision v2 (2026-07): back to the default sans-serif app-wide — the
# full-monospace look from the first restyle pass read as unprofessional.
# Monospace survives only as an accent (stat numbers, micro-labels, chips,
# "why:" prefixes) via app/intake.py's DARK_CSS.
# Accent decision v2: orange #e0872f -> indigo. Classic indigo (#4B0082) is
# nearly invisible on this near-black background, so we use a light indigo
# (#818cf8, indigo-400) that keeps contrast for text and borders.

[theme]
base = "dark"
primaryColor = "#818cf8"
backgroundColor = "#0f1115"
secondaryBackgroundColor = "#1b1e26"
textColor = "#e8e9ec"
font = "sans serif"
